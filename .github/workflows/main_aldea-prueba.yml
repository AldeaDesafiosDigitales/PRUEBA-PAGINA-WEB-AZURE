
name: Build and deploy ASP.NET Core - aldea-prueba

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: >
          dotnet restore
          "Prueba pagina azure NET/Prueba pagina azure NET.csproj"

      - name: Build with dotnet
        run: >
          dotnet build
          "Prueba pagina azure NET/Prueba pagina azure NET.csproj"
          --configuration Release
          --no-restore

      - name: Publish .NET application
        run: >
          dotnet publish
          "Prueba pagina azure NET/Prueba pagina azure NET.csproj"
          --configuration Release
          --no-build
          --output "${{ github.workspace }}/publish"

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish
          if-no-files-found: error

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B010CFA395A5462E8F546433213329D9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_474D372019C74C6CA7BF5E128C776174 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C78C83BEC60C4622AEC4F3602AC12A7D }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'aldea-prueba'
          slot-name: 'Production'
          package: ./publish
